[package]
name = "mail-cli"
version = "0.2.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
imap = { version = "3.0.0-alpha.15", default-features = false, features = ["rustls-tls"] }
# Re-used for the `\Sent` special-use LIST attribute (RFC 6154) when
# auto-discovering the Sent folder. Pinned to the version `imap` resolves to so
# the `NameAttribute` type matches what `imap::types::Name::attributes()` returns.
imap-proto = "=0.16.7"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "pool", "rustls-tls", "hostname"] }
mail-parser = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
mime_guess = "2"

[dev-dependencies]
# Integration tests seed GreenMail via IMAP APPEND with a controlled
# INTERNALDATE (which SINCE/BEFORE/ON match). chrono provides that datetime;
# same major version the `imap` crate uses.
chrono = { version = "0.4", default-features = false, features = ["std"] }
imap = { version = "3.0.0-alpha.15", default-features = false }

[profile.release]
strip = true
lto = true
